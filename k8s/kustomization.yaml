apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: disaster
resources:
  - namespace.yaml
  - artemis.yaml
  - postgres.yaml
  - mailhog.yaml
  - disaster-registry.yaml
  - notifications.yaml
configMapGenerator:
  - name: artemis-config
    options:
      disableNameSuffixHash: true
    files:
      - config/broker.xml
  - name: postgres-init
    options:
      disableNameSuffixHash: true
    files:
      - config/001_disaster_registry.sql
