apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: disaster
resources:
  - namespace.yaml
  - artemis.yaml
  - postgres.yaml
  - mailhog.yaml
  # Los Deployments de registro-desastres y notificaciones (Rol 2) se agregan aquí
configMapGenerator:
  - name: artemis-config
    options:
      disableNameSuffixHash: true
    files:
      - ../infra/artemis/broker.xml
