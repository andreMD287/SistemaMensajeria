# Se ejecuta bajo demanda (no forma parte del kustomization):
#   docker build -t disaster-simulator:latest ./simulator
#   kubectl apply -f k8s/simulator-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: report-simulator-
  namespace: disaster
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false   # evita que K8s inyecte variables *_PORT=tcp://... por cada Service
      containers:
        - name: simulator
          image: disaster-simulator:latest
          imagePullPolicy: Never   # imagen local de Docker Desktop
          args: ["--count", "5"]
          env:
            - { name: BROKER_HOST, value: artemis }
            - { name: BROKER_PORT, value: "61616" }
            - { name: BROKER_USER, value: disaster }
            - { name: BROKER_PASSWORD, value: disaster }
