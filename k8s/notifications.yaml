apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifications }
  template:
    metadata:
      labels: { app: notifications }
    spec:
      enableServiceLinks: false   # evita variables *_PORT=tcp://... inyectadas por cada Service
      containers:
        - name: notifications
          image: sistemamensajeria-notifications:latest
          imagePullPolicy: Never   # imagen local: docker compose build notifications
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: BROKER_HOST, value: artemis }
            - { name: BROKER_PORT, value: "61616" }
            - { name: BROKER_USER, value: disaster }
            - { name: BROKER_PASSWORD, value: disaster }
            - { name: SMTP_HOST, value: mailhog }
            - { name: SMTP_PORT, value: "1025" }
            - { name: MAIL_FROM, value: alertas@desastres.local }
            - { name: NOTIFICATION_EMAIL_TO, value: pruebas@desastres.local }
            - { name: SMS_PHONE, value: "+573000000000" }
            - { name: ENABLE_TEST_ENDPOINT, value: "true" }
          readinessProbe:
            httpGet: { path: /notifications/api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /notifications/api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: disaster
spec:
  selector: { app: notifications }
  ports:
    - { name: http, port: 8080, targetPort: http }
