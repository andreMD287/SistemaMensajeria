apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artemis
  namespace: disaster
spec:
  serviceName: artemis
  replicas: 1
  selector:
    matchLabels: { app: artemis }
  template:
    metadata:
      labels: { app: artemis }
    spec:
      enableServiceLinks: false
      containers:
        - name: artemis
          image: apache/activemq-artemis:2.37.0
          ports:
            - { name: broker, containerPort: 61616 }
            - { name: console, containerPort: 8161 }
          env:
            - { name: ARTEMIS_USER, value: disaster }       # solo desarrollo
            - { name: ARTEMIS_PASSWORD, value: disaster }
            - { name: ANONYMOUS_LOGIN, value: "false" }
          volumeMounts:
            # broker.xml completo: la imagen lo copia sobre etc/broker.xml al crear la instancia
            - { name: config, mountPath: /var/lib/artemis-instance/etc-override/broker.xml, subPath: broker.xml, readOnly: true }
          readinessProbe:
            tcpSocket: { port: broker }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: artemis-config
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: disaster
spec:
  selector: { app: artemis }
  ports:
    - { name: broker, port: 61616, targetPort: broker }
    - { name: console, port: 8161, targetPort: console }
