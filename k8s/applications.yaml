apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-registry
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disaster-registry
  template:
    metadata:
      labels:
        app: disaster-registry
    spec:
      containers:
        - name: disaster-registry
          image: sistemamensajeria-disaster-registry:latest
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: BROKER_HOST, value: artemis }
            - { name: BROKER_PORT, value: "61616" }
            - { name: BROKER_USER, value: disaster }
            - { name: BROKER_PASSWORD, value: disaster }
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/disasters }
            - { name: DB_USER, value: disaster }
            - { name: DB_PASSWORD, value: disaster }
          readinessProbe:
            httpGet:
              path: /disaster-registry/api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-registry
  namespace: disaster
spec:
  selector:
    app: disaster-registry
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: sistemamensajeria-notifications:latest
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: BROKER_HOST, value: artemis }
            - { name: BROKER_PORT, value: "61616" }
            - { name: BROKER_USER, value: disaster }
            - { name: BROKER_PASSWORD, value: disaster }
            - { name: SMTP_HOST, value: mailhog }
            - { name: SMTP_PORT, value: "1025" }
            - { name: MAIL_FROM, value: alertas@desastres.local }
            - { name: NOTIFICATION_EMAIL_TO, value: pruebas@desastres.local }
            - { name: ENABLE_TEST_ENDPOINT, value: "true" }
            - { name: SMS_PHONE, value: "+573000000000" }
          readinessProbe:
            httpGet:
              path: /notifications/api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: disaster
spec:
  selector:
    app: notifications
  ports:
    - { name: http, port: 8080, targetPort: http }