services:
  disaster-registry:
    image: disaster-registry:latest   # mismo nombre que usa k8s/
    build:
      context: ./services/disaster-registry
    container_name: disaster-registry-app
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
    environment:
      BROKER_HOST: artemis
      BROKER_PORT: "61616"
      BROKER_USER: disaster
      BROKER_PASSWORD: disaster
    ports:
      - "8080:8080"
      - "9990:9990"

  notifications:
    image: notifications:latest       # mismo nombre que usa k8s/
    build:
      context: ./services/notifications
    container_name: notifications-app
    depends_on:
      artemis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      BROKER_HOST: artemis
      BROKER_PORT: "61616"
      BROKER_USER: disaster
      BROKER_PASSWORD: disaster
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: alertas@desastres.local
      NOTIFICATION_EMAIL_TO: pruebas@desastres.local
      ENABLE_TEST_ENDPOINT: "true"
      SMS_PHONE: "+573000000000"
    ports:
      - "8081:8080"