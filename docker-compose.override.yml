services:
  disaster-registry:
    build:
      context: ./services/disaster-registry
    container_name: disaster-registry-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9990:9990"

  notifications:
    build:
      context: ./services/notifications
    container_name: notifications-app
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8081:8080"