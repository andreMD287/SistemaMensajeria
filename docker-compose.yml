services:
  postgres:
    image: postgres:16-alpine
    container_name: disaster-postgres
    environment:
      POSTGRES_DB: disasters
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster -d disasters"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: disaster-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: disaster
      RABBITMQ_DEFAULT_PASS: disaster
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: disaster-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # Simulador de sistemas emisores (bajo demanda):
  #   docker compose run --rm simulator --count 5
  simulator:
    build: ./simulator
    profiles: ["tools"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: disaster
      RABBITMQ_PASS: disaster

volumes:
  postgres_data:
  rabbitmq_data:

