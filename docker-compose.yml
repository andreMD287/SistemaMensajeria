services:
  postgres:
    image: postgres:16-alpine
    container_name: disaster-postgres
    environment:
      POSTGRES_DB: disasters
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster -d disasters"]
      interval: 5s
      timeout: 5s
      retries: 10

  artemis:
    image: apache/activemq-artemis:2.37.0
    container_name: disaster-artemis
    environment:
      ARTEMIS_USER: disaster
      ARTEMIS_PASSWORD: disaster
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"   # core/JMS, AMQP, MQTT, OpenWire y STOMP
      - "8161:8161"     # consola web
    volumes:
      - ./infra/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: disaster-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # Simulador de sistemas emisores (bajo demanda):
  #   docker compose run --rm simulator --count 5
  simulator:
    build: ./simulator
    profiles: ["tools"]
    depends_on:
      artemis:
        condition: service_healthy
    environment:
      BROKER_HOST: artemis
      BROKER_PORT: "61616"
      BROKER_USER: disaster
      BROKER_PASSWORD: disaster

volumes:
  postgres_data:

